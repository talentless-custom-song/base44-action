# BuildHub runs from the cloned source: a Vite dev server on host port 3000 and an
# Express API that uploads, builds and packages uploaded archives.
name: buildhub

services:
  api:
    build: .
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
        exec npm start
    restart: on-failure
    volumes:
      - ./api:/app
      - buildhub_api_node_modules:/app/node_modules
      - buildhub_data:/app/data
    environment:
      - PORT=8000
      - DATA_DIR=/app/data
      - BUILD_WORKDIR=/tmp/buildhub
      - BASE44_PREVIEW_MODE
    # GitHub dispatch credentials (GITHUB_TOKEN, BUILDER_OWNER, BUILDER_REPO) come
    # from the platform-managed secrets file. Optional so the app boots without them.
    env_file:
      - path: /run/base44/app.env
        required: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      base44.project: BuildHub API
      base44.kind: api

  web:
    build: .
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
        exec npm run dev
    restart: on-failure
    ports:
      - "3000:5173"
    volumes:
      - ./web:/app
      - buildhub_web_node_modules:/app/node_modules
    environment:
      - API_PROXY_TARGET=http://api:8000
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      base44.project: BuildHub
      base44.kind: web
      base44.port: "3000"

volumes:
  buildhub_data:
  buildhub_api_node_modules:
  buildhub_web_node_modules:
